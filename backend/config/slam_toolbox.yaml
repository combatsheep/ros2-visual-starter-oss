# The slam_toolbox section is adapted from SLAM Toolbox 2.8.5
# config/mapper_params_online_async.yaml, commit
# ec8f7635dea317b531c419f798f87d90a336f32e (conservatively LGPL-2.1-only).
# The map_saver section is adapted from Navigation2 1.3.12
# nav2_bringup/params/nav2_params.yaml, commit
# 6be3614013ec586051b86c97b919b293281490fe (Apache-2.0).
# Changes tune frames, scan ranges, timing, loop-closure thresholds, and map
# saving for the simulated training room. See docs/DEPENDENCY_LICENSE_AUDIT.md,
# LICENSES/LGPL-2.1-only.txt, LICENSES/Apache-2.0.txt, and
# LICENSES/Navigation2-LICENSE.txt.

slam_toolbox:
  ros__parameters:
    use_sim_time: false
    use_lifecycle_manager: true
    solver_plugin: solver_plugins::CeresSolver
    ceres_linear_solver: SPARSE_NORMAL_CHOLESKY
    ceres_preconditioner: SCHUR_JACOBI
    ceres_trust_strategy: LEVENBERG_MARQUARDT
    ceres_dogleg_type: TRADITIONAL_DOGLEG
    ceres_loss_function: None
    odom_frame: odom
    map_frame: map
    base_frame: base_link
    scan_topic: /scan
    use_map_saver: true
    mode: mapping
    debug_logging: false
    throttle_scans: 1
    transform_publish_period: 0.05
    map_update_interval: 1.0
    resolution: 0.05
    minimum_time_interval: 0.1
    max_laser_range: 8.0
    transform_timeout: 0.3
    tf_buffer_duration: 30.0
    stack_size_to_use: 40000000
    enable_interactive_mode: false
    use_scan_matching: true
    use_scan_barycenter: true
    minimum_travel_distance: 0.12
    minimum_travel_heading: 0.12
    scan_buffer_size: 10
    scan_buffer_maximum_scan_distance: 10.0
    link_match_minimum_response_fine: 0.1
    link_scan_maximum_distance: 1.5
    loop_search_maximum_distance: 3.0
    do_loop_closing: true
    # Avoid accepting a short/ambiguous loop closure while driving through a narrow passage.
    loop_match_minimum_chain_size: 10
    loop_match_maximum_variance_coarse: 3.0
    loop_match_minimum_response_coarse: 0.45
    loop_match_minimum_response_fine: 0.55
    correlation_search_space_dimension: 0.5
    correlation_search_space_resolution: 0.01
    correlation_search_space_smear_deviation: 0.1
    loop_search_space_dimension: 8.0
    loop_search_space_resolution: 0.05
    loop_search_space_smear_deviation: 0.03
    distance_variance_penalty: 0.5
    angle_variance_penalty: 1.0
    fine_search_angle_offset: 0.00349
    coarse_search_angle_offset: 0.349
    coarse_angle_resolution: 0.0349
    minimum_angle_penalty: 0.9
    minimum_distance_penalty: 0.5
    use_response_expansion: true
    min_pass_through: 2
    occupancy_threshold: 0.1

map_saver:
  ros__parameters:
    use_sim_time: false
    save_map_timeout: 10.0
    free_thresh_default: 0.25
    occupied_thresh_default: 0.65
    map_subscribe_transient_local: true
