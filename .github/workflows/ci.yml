name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.23.2
          cache: npm

      - name: Set up Pixi
        uses: prefix-dev/setup-pixi@28eb668aafebd9dede9d97c4ba1cd9989a4d0004 # v0.9.2
        with:
          pixi-version: v0.77.0
          cache: true
          locked: true

      - name: Public release audit
        run: make public-audit

      - name: Install frontend dependencies
        run: npm ci --no-audit --no-fund

      - name: Frontend verification
        run: |
          npm run typecheck
          npm run lint
          npm test
          npm run build

      - name: Install locked ROS environment
        run: pixi install --locked

      - name: Backend tests
        run: pixi run test-backend

      - name: Verify downloaded vision assets
        run: |
          pixi run vision-assets
          pixi run vision-smoke

      - name: Loopback SIM smoke
        run: scripts/ci_sim_smoke.sh

      - name: Managed process crash recovery
        run: scripts/ci_process_ownership_smoke.sh
