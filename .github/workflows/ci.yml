name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.23.2
          cache: npm

      - name: Set up verified Pixi
        run: |
          ./scripts/bootstrap_pixi.sh
          echo "$HOME/.pixi/bin" >> "$GITHUB_PATH"
          "$HOME/.pixi/bin/pixi" install --locked

      - name: Public release audit
        run: make public-audit

      - name: Install frontend dependencies
        run: npm ci --no-audit --no-fund

      - name: Frontend verification
        run: |
          npm run typecheck
          npm run lint
          npm test
          npm run build

      - name: Backend tests
        run: pixi run test-backend

      - name: Verify downloaded vision assets
        run: |
          pixi run vision-assets
          pixi run vision-smoke

      - name: Loopback SIM smoke
        run: scripts/ci_sim_smoke.sh

      - name: Managed process crash recovery
        run: scripts/ci_process_ownership_smoke.sh
