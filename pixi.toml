[workspace]
name = "ros2-visual-starter"
version = "0.1.0"
channels = ["https://prefix.dev/robostack-jazzy", "conda-forge"]
platforms = ["osx-arm64", "linux-64"]

[dependencies]
nodejs = "22.*"
python = "3.12.*"
ros-jazzy-ros-base = ">=0.11"
ros-jazzy-rosbridge-suite = ">=2.1"
ros-jazzy-rclpy = ">=7.0"
ros-jazzy-geometry-msgs = ">=5.3"
ros-jazzy-sensor-msgs = ">=5.3"
ros-jazzy-nav-msgs = ">=5.3"
ros-jazzy-std-msgs = ">=5.3"
ros-jazzy-tf2-msgs = ">=0.36"
ros-jazzy-tf2-ros = ">=0.36"
ros-jazzy-tf2-tools = ">=0.36"
ros-jazzy-map-msgs = ">=2.4"
ros-jazzy-nav2-msgs = ">=1.3"
ros-jazzy-vision-msgs = ">=4.1"
ros-jazzy-launch = ">=3.4"
ros-jazzy-launch-ros = ">=0.26"
ros-jazzy-slam-toolbox = ">=2.8"
ros-jazzy-navigation2 = ">=1.3"
ros-jazzy-rmw-fastrtps-cpp = ">=8.4"
pytest = ">=8,<9"
numpy = ">=1.26,<3"
onnxruntime = ">=1.20,<2"
pillow = ">=11,<13"
tornado = "==6.5.8"

[tasks]
test-backend = "PYTHONPATH=backend python -m pytest backend/tests"
safety-node = "PYTHONPATH=backend python -m ros2_visual_backend.safety_node"
ros-base = "PYTHONPATH=backend python -m ros2_visual_backend.launcher base"
ros-mapping = "PYTHONPATH=backend python -m ros2_visual_backend.launcher mapping"
ros-navigation = "PYTHONPATH=backend python -m ros2_visual_backend.launcher navigation"
ros-exploration = "PYTHONPATH=backend python -m ros2_visual_backend.launcher exploration"
vision-assets = "bash scripts/download_vision_assets.sh"
vision-smoke = "PYTHONPATH=backend python -m ros2_visual_backend.vision_smoke"
vision-asset-smoke = "PYTHONPATH=backend python -m ros2_visual_backend.vision_asset_smoke"
llm-smoke = "PYTHONPATH=backend python -m ros2_visual_backend.local_llm_smoke"
